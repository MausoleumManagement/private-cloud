# redefine the default project to have minimal permissions
# otherwise it gets relaxed permissions
# https://argo-cd.readthedocs.io/en/stable/user-guide/projects/#the-default-project
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
spec:
  sourceIntegrity:
    git:
      policies:
        - repos:
          - url: '*'
          gpg:
            mode: strict
            keys: 
              - 22C316A353F6F11ED2693628FD9D433219DA6540
  sourceRepos: []
  sourceNamespaces: []
  destinations: []
  clusterResourceBlacklist:
  - group: '*'
    kind: '*'
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist: []
