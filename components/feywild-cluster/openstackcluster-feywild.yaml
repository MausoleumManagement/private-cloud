---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: OpenStackCluster
metadata:
  name: feywild
  namespace: default
spec:
  apiServer:
    managedLoadBalancer:
      enabled: true
  externalNetwork:
    filter:
      name: ext01
  identityRef:
    cloudName: openstack
    name: feywild-cloud-config
  managedSecurityGroups:
    clusterNodesSecurityGroupRules:
      - description: Created by cluster-api-provider-openstack - BGP (calico)
        direction: ingress
        etherType: IPv4
        name: BGP (Calico)
        portRangeMax: 179
        portRangeMin: 179
        protocol: tcp
        remoteManagedGroups:
          - controlplane
          - worker
      - description: Created by cluster-api-provider-openstack - IP-in-IP (calico)
        direction: ingress
        etherType: IPv4
        name: IP-in-IP (calico)
        protocol: "4"
        remoteManagedGroups:
          - controlplane
          - worker
  managedSubnets:
    - cidr: 10.6.0.0/24
      dnsNameservers:
        - 9.9.9.9
